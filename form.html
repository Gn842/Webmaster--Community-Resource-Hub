    <h1 class="websiteTitle" style="text-align: center;">Contact Us</h1><br><br><br><br><br><br>
    <div style="text-align: center;">
    <form>
        <label for=”suggestions”>Do you have any suggestions or tips for improving our community?</label><br><br>
        <input type=”text” id=”suggestions” name=”suggestions”><br><br><br>

        <label for=”qcc”>Do you have any questions, comments, or concerns about anything in our community?</label><br><br>
        <input type=”text” id=”qcc” name=”qcc”><br><br><br>

        <label for=”email”>If you would like, you can put your email here so we can reach you regarding your response. (optional)</label><br><br>
        <input type=”text” id=”email” name=”email”><br><br><br>

        <label for=”feedback”>Do you have any feedback on the website? Is the information easily accessible?</label><br><br>
        <input type=”text” id=”feedback” name=”feedback”><br><br><br>
        <input class="submit" type="submit" value="Submit"><br><br><br>
    </form>
